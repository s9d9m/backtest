[project]
name = "orb-lab"
version = "0.5.0"
description = "Research platform for walk-forward testing Opening Range Breakout strategies on futures"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orb_lab*"]
